# Daily Tracker push server. See README.md for the step-by-step deploy guide.
name = "daily-tracker-push"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Send due reminders every minute.
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "daily-tracker-push"
# Paste the database_id printed by `npx wrangler d1 create daily-tracker-push`:
database_id = "8ec03735-83cc-4826-8c0f-fc475e832c0e"

[vars]
# Public key from `npm run setup-keys` (also paste it into the app's settings).
VAPID_PUBLIC_KEY = "BLUUImAraYEnOXAgkaumD_1sm9xEfv9e0vqsmUdwx3T47-iXf9wk3UdU882945seztFLYXctviepwysKYvQTbLA"
# A contact address for push services. Replace with your own mailto: or https: URL.
VAPID_SUBJECT = "https://michaelmatusikjr.github.io/Daily-tracker-/"
# The app's origin(s), comma-separated, no trailing slash, e.g. "https://yourname.github.io"
ALLOWED_ORIGINS = "https://michaelmatusikjr.github.io"
# Most devices that may register (stops strangers filling your free quota). Default 20.
MAX_DEVICES = "20"
# Secrets (never put them here), set after the first deploy:
#   npx wrangler secret put VAPID_PRIVATE_KEY
#   npx wrangler secret put REGISTER_KEY

